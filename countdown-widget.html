<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–overlay-color: rgba(0,0,0,0.38);
–text-color: #ffffff;
–accent-color: #d4bfa0;
–label-color: rgba(255,255,255,0.65);
–border-color: rgba(255,255,255,0.22);
–font-display: ‘Cormorant Garamond’, serif;
–font-ui: ‘Josefin Sans’, sans-serif;
–blur: 0px;
}

body {
font-family: var(–font-ui);
background: #1a1a1a;
height: 100vh;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
}

/* ── WIDGET ── */
#widget {
position: relative;
width: 100%;
height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
overflow: hidden;
}

#bg-image {
position: absolute;
inset: 0;
background-size: cover;
background-position: center;
filter: blur(var(–blur));
transform: scale(1.04); /* prevent blur edge bleed */
transition: background-image 0.4s, filter 0.3s;
}

#bg-overlay {
position: absolute;
inset: 0;
background: var(–overlay-color);
transition: background 0.3s;
}

/* drop zone */
#drop-zone {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
z-index: 2;
opacity: 0;
transition: opacity 0.2s;
pointer-events: none;
}
#drop-zone.active {
opacity: 1;
pointer-events: all;
background: rgba(0,0,0,0.55);
border: 3px dashed var(–accent-color);
}
#drop-zone span {
color: #fff;
font-family: var(–font-ui);
font-size: 13px;
letter-spacing: 0.2em;
text-transform: uppercase;
}

/* ── CONTENT ── */
#content {
position: relative;
z-index: 3;
text-align: center;
padding: 40px 32px;
display: flex;
flex-direction: column;
align-items: center;
gap: 0;
width: 100%;
}

#event-label {
font-family: var(–font-ui);
font-size: 10px;
font-weight: 300;
letter-spacing: 0.35em;
text-transform: uppercase;
color: var(–accent-color);
margin-bottom: 14px;
transition: color 0.3s;
}

#headline {
font-family: var(–font-display);
font-size: clamp(36px, 7vw, 72px);
font-weight: 300;
font-style: italic;
color: var(–text-color);
line-height: 1.1;
margin-bottom: 8px;
transition: color 0.3s;
}

#subline {
font-family: var(–font-ui);
font-size: 10px;
font-weight: 100;
letter-spacing: 0.3em;
text-transform: uppercase;
color: var(–label-color);
margin-bottom: 44px;
transition: color 0.3s;
}

/* ── COUNTER ── */
#counter {
display: flex;
gap: clamp(16px, 4vw, 48px);
align-items: flex-start;
}

.unit {
display: flex;
flex-direction: column;
align-items: center;
gap: 8px;
}

.unit-number {
font-family: var(–font-display);
font-size: clamp(42px, 9vw, 96px);
font-weight: 300;
line-height: 1;
color: var(–text-color);
min-width: 2ch;
text-align: center;
transition: color 0.3s, transform 0.15s;
display: block;
}

.unit-number.tick {
transform: translateY(-4px);
opacity: 0.7;
}

.unit-label {
font-family: var(–font-ui);
font-size: 8px;
font-weight: 300;
letter-spacing: 0.32em;
text-transform: uppercase;
color: var(–label-color);
transition: color 0.3s;
}

.divider {
font-family: var(–font-display);
font-size: clamp(36px, 7vw, 72px);
font-weight: 300;
color: var(–border-color);
line-height: 1;
margin-top: 4px;
user-select: none;
}

/* ── DATE LINE ── */
#date-line {
margin-top: 40px;
padding-top: 24px;
border-top: 1px solid var(–border-color);
width: clamp(200px, 50%, 380px);
text-align: center;
}

#date-display {
font-family: var(–font-ui);
font-size: 10px;
font-weight: 300;
letter-spacing: 0.28em;
text-transform: uppercase;
color: var(–label-color);
transition: color 0.3s;
}

/* ── PANEL TOGGLE ── */
#panel-toggle {
position: fixed;
bottom: 16px;
right: 16px;
z-index: 100;
background: rgba(255,255,255,0.12);
border: 1px solid rgba(255,255,255,0.2);
border-radius: 50%;
width: 36px;
height: 36px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
backdrop-filter: blur(8px);
transition: background 0.2s;
color: #fff;
}
#panel-toggle:hover { background: rgba(255,255,255,0.22); }
#panel-toggle svg { width: 16px; height: 16px; fill: #fff; }

/* ── CONTROL PANEL ── */
#panel {
position: fixed;
bottom: 60px;
right: 16px;
z-index: 99;
width: 272px;
background: rgba(16, 14, 12, 0.92);
border: 1px solid rgba(255,255,255,0.12);
border-radius: 12px;
padding: 20px 18px;
backdrop-filter: blur(20px);
display: none;
flex-direction: column;
gap: 16px;
font-family: var(–font-ui);
}
#panel.open { display: flex; }

.panel-title {
font-size: 9px;
letter-spacing: 0.3em;
text-transform: uppercase;
color: rgba(255,255,255,0.4);
padding-bottom: 10px;
border-bottom: 1px solid rgba(255,255,255,0.08);
}

.ctrl {
display: flex;
flex-direction: column;
gap: 5px;
}

.ctrl label {
font-size: 9px;
letter-spacing: 0.2em;
text-transform: uppercase;
color: rgba(255,255,255,0.5);
}

.ctrl input[type=“text”],
.ctrl input[type=“date”] {
background: rgba(255,255,255,0.06);
border: 1px solid rgba(255,255,255,0.12);
border-radius: 6px;
color: #fff;
font-family: var(–font-ui);
font-size: 12px;
padding: 7px 10px;
width: 100%;
outline: none;
transition: border-color 0.2s;
}
.ctrl input[type=“text”]:focus,
.ctrl input[type=“date”]:focus {
border-color: rgba(255,255,255,0.3);
}

.ctrl input[type=“color”] {
width: 100%;
height: 32px;
border: 1px solid rgba(255,255,255,0.12);
border-radius: 6px;
background: transparent;
cursor: pointer;
padding: 2px;
}

.ctrl input[type=“range”] {
width: 100%;
accent-color: var(–accent-color);
}

.ctrl-row {
display: flex;
gap: 10px;
align-items: flex-end;
}
.ctrl-row .ctrl { flex: 1; }

/* image upload button */
#img-btn {
width: 100%;
padding: 8px;
background: rgba(255,255,255,0.06);
border: 1px dashed rgba(255,255,255,0.2);
border-radius: 6px;
color: rgba(255,255,255,0.7);
font-family: var(–font-ui);
font-size: 10px;
letter-spacing: 0.15em;
text-transform: uppercase;
cursor: pointer;
transition: background 0.2s, border-color 0.2s;
text-align: center;
}
#img-btn:hover {
background: rgba(255,255,255,0.1);
border-color: rgba(255,255,255,0.35);
}

#img-input { display: none; }

.swatch-row {
display: flex;
gap: 6px;
flex-wrap: wrap;
}
.swatch {
width: 22px;
height: 22px;
border-radius: 50%;
cursor: pointer;
border: 2px solid transparent;
transition: border-color 0.15s, transform 0.15s;
}
.swatch:hover, .swatch.active { border-color: #fff; transform: scale(1.15); }

/* preset themes */
.theme-row {
display: flex;
gap: 6px;
}
.theme-btn {
flex: 1;
padding: 5px;
font-size: 8px;
letter-spacing: 0.15em;
text-transform: uppercase;
border-radius: 5px;
border: 1px solid rgba(255,255,255,0.15);
background: transparent;
color: rgba(255,255,255,0.6);
cursor: pointer;
transition: background 0.2s, color 0.2s;
font-family: var(–font-ui);
}
.theme-btn:hover {
background: rgba(255,255,255,0.1);
color: #fff;
}

/* ── EMBED TIP ── */
#embed-tip {
position: fixed;
bottom: 16px;
left: 16px;
z-index: 100;
background: rgba(16,14,12,0.85);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 8px;
padding: 8px 12px;
font-size: 9px;
letter-spacing: 0.15em;
text-transform: uppercase;
color: rgba(255,255,255,0.35);
font-family: var(–font-ui);
backdrop-filter: blur(10px);
}

/* ── PAST STATE ── */
#past-msg {
font-family: var(–font-display);
font-size: clamp(20px, 4vw, 36px);
font-weight: 300;
font-style: italic;
color: var(–text-color);
margin-top: 12px;
display: none;
}
</style>

<script>
  // ── STATE ──
  const state = {
    targetDate: null,
    title: 'Our Wedding Day',
    label: 'Counting down to',
    sub: 'Wicklow, Ireland',
    accent: '#d4bfa0',
    blur: 0,
    overlay: 0.38,
    bgImage: null,
  };

  // ── LOAD / SAVE ──
  function save() {
    const s = { ...state };
    delete s.bgImage; // don't save image in URL params
    try { localStorage.setItem('cdw', JSON.stringify(s)); } catch(e) {}
  }

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem('cdw') || '{}');
      Object.assign(state, s);
      if (state.targetDate) state.targetDate = new Date(state.targetDate);
    } catch(e) {}
  }

  // ── COUNTDOWN ──
  function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

  function tick() {
    if (!state.targetDate) return;
    const now = new Date();
    const diff = state.targetDate - now;
    const counter = document.getElementById('counter');
    const pastMsg = document.getElementById('past-msg');

    if (diff <= 0) {
      counter.style.display = 'none';
      pastMsg.style.display = 'block';
      return;
    }

    counter.style.display = 'flex';
    pastMsg.style.display = 'none';

    const totalSecs = diff / 1000;
    const d = Math.floor(totalSecs / 86400);
    const h = Math.floor((totalSecs % 86400) / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = Math.floor(totalSecs % 60);

    const units = [
      { id: 'days', val: d },
      { id: 'hours', val: pad(h) },
      { id: 'minutes', val: pad(m) },
      { id: 'seconds', val: pad(s) },
    ];

    units.forEach(u => {
      const el = document.getElementById(u.id);
      const current = el.textContent;
      if (current !== String(u.val)) {
        el.classList.add('tick');
        setTimeout(() => el.classList.remove('tick'), 150);
        el.textContent = u.val;
      }
    });
  }

  // ── RENDER STYLE ──
  function applyStyle() {
    const r = document.documentElement.style;
    r.setProperty('--accent-color', state.accent);
    r.setProperty('--blur', state.blur + 'px');
    r.setProperty('--overlay-color', hexAlpha('#000000', state.overlay));

    const bg = document.getElementById('bg-image');
    if (state.bgImage) {
      bg.style.backgroundImage = `url(${state.bgImage})`;
    }

    document.getElementById('headline').textContent = state.title;
    document.getElementById('event-label').textContent = state.label;
    document.getElementById('subline').textContent = state.sub;

    if (state.targetDate) {
      const opts = { year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date-display').textContent =
        state.targetDate.toLocaleDateString(undefined, opts).toUpperCase();
    }
  }

  function hexAlpha(hex, alpha) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ── CONTROLS ──
  function syncControls() {
    document.getElementById('ctrl-title').value = state.title;
    document.getElementById('ctrl-label').value = state.label;
    document.getElementById('ctrl-sub').value = state.sub;
    document.getElementById('ctrl-accent').value = state.accent;
    document.getElementById('ctrl-blur').value = state.blur;
    document.getElementById('ctrl-overlay').value = Math.round(state.overlay * 100);
    document.getElementById('blur-val').textContent = state.blur;
    document.getElementById('overlay-val').textContent = Math.round(state.overlay * 100);
    if (state.targetDate) {
      const d = state.targetDate;
      const iso = d.toISOString().split('T')[0];
      document.getElementById('ctrl-date').value = iso;
    }
  }

  document.getElementById('ctrl-date').addEventListener('input', e => {
    state.targetDate = e.target.value ? new Date(e.target.value + 'T12:00:00') : null;
    applyStyle(); tick(); save();
  });

  ['ctrl-title','ctrl-label','ctrl-sub'].forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      const map = { 'ctrl-title':'title','ctrl-label':'label','ctrl-sub':'sub' };
      state[map[id]] = e.target.value;
      applyStyle(); save();
    });
  });

  document.getElementById('ctrl-blur').addEventListener('input', e => {
    state.blur = +e.target.value;
    document.getElementById('blur-val').textContent = state.blur;
    applyStyle(); save();
  });

  document.getElementById('ctrl-overlay').addEventListener('input', e => {
    state.overlay = +e.target.value / 100;
    document.getElementById('overlay-val').textContent = e.target.value;
    applyStyle(); save();
  });

  document.getElementById('ctrl-accent').addEventListener('input', e => {
    state.accent = e.target.value;
    applyStyle(); save();
  });

  // swatches
  document.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      state.accent = sw.dataset.color;
      document.getElementById('ctrl-accent').value = state.accent;
      applyStyle(); save();
    });
  });

  // themes
  const themes = {
    dark:  { text: '#ffffff', label: 'rgba(255,255,255,0.6)', border: 'rgba(255,255,255,0.2)', overlay: 0.45 },
    light: { text: '#1a1008', label: 'rgba(30,20,10,0.55)', border: 'rgba(0,0,0,0.15)', overlay: 0.08 },
    warm:  { text: '#f5ede0', label: 'rgba(245,237,224,0.6)', border: 'rgba(245,237,224,0.2)', overlay: 0.5 },
    cool:  { text: '#e8f0f5', label: 'rgba(200,220,235,0.65)', border: 'rgba(200,220,235,0.2)', overlay: 0.5 },
  };

  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = themes[btn.dataset.theme];
      if (!t) return;
      document.documentElement.style.setProperty('--text-color', t.text);
      document.documentElement.style.setProperty('--label-color', t.label);
      document.documentElement.style.setProperty('--border-color', t.border);
      state.overlay = t.overlay;
      document.getElementById('ctrl-overlay').value = Math.round(t.overlay * 100);
      document.getElementById('overlay-val').textContent = Math.round(t.overlay * 100);
      applyStyle(); save();
    });
  });

  // ── IMAGE UPLOAD ──
  function handleImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      state.bgImage = e.target.result;
      applyStyle();
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('img-btn').addEventListener('click', () => {
    document.getElementById('img-input').click();
  });

  document.getElementById('img-input').addEventListener('change', e => {
    handleImageFile(e.target.files[0]);
  });

  // ── DRAG & DROP ──
  const widget = document.getElementById('widget');
  const dropZone = document.getElementById('drop-zone');

  widget.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('active');
  });

  widget.addEventListener('dragleave', e => {
    if (!widget.contains(e.relatedTarget)) {
      dropZone.classList.remove('active');
    }
  });

  widget.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('active');
    const file = e.dataTransfer.files[0];
    handleImageFile(file);
  });

  // ── PANEL TOGGLE ──
  document.getElementById('panel-toggle').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('open');
  });

  // ── INIT ──
  loadState();
  applyStyle();
  syncControls();
  tick();
  setInterval(tick, 1000);
</script>

</body>
